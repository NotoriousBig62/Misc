<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quizz des explorateurs</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Trebuchet MS',Arial,sans-serif;color:#29284a;background:linear-gradient(135deg,#63d7e5,#b993f5)}.wrap{max-width:900px;margin:auto;padding:20px}h1{text-align:center;font-size:clamp(2rem,6vw,3rem);color:white;text-shadow:2px 3px #5b3fa0;margin:8px 0}.sub{text-align:center;color:white;margin:0 0 20px}.card{background:white;border-radius:22px;padding:22px;box-shadow:0 8px 20px #30205b33;margin-bottom:18px}h2{margin:0 0 14px;color:#5b3fa0}.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.theme{border:3px solid #ddd;border-radius:15px;padding:12px;text-align:center;cursor:pointer;font-weight:bold;background:#fafaff}.theme .ic{font-size:1.9em;display:block}.theme.on{border-color:#5b3fa0;background:#efe6ff}.theme small{display:block;font-weight:normal;color:#666}.row{display:flex;flex-wrap:wrap;gap:18px}.field{flex:1;min-width:200px}label{font-weight:bold;display:block;margin:8px 0 6px}select,input{width:100%;padding:10px;font:inherit;border:2px solid #c9c7d8;border-radius:11px;color:#29284a}input[type=range]{padding:0;accent-color:#5b3fa0}button{font-size:1rem;font-weight:bold;border:0;border-radius:14px;padding:12px 19px;cursor:pointer;background:#5b3fa0;color:white}button:hover{filter:brightness(1.1)}button.alt{background:#efedf6;color:#34304f}button:disabled{opacity:.5;cursor:not-allowed}.center{text-align:center}.small{font-size:.9rem;color:#64627a}.profile-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}.player-config{background:#f6f4ff;padding:14px;border:2px solid #e4def8;border-radius:16px}.player-config h3{margin:0 0 10px;color:#5b3fa0}.bar{height:12px;background:#eee;border-radius:8px;overflow:hidden;margin-bottom:14px}.bar div{height:100%;background:#4cc38a;width:0;transition:.25s}.tag{display:inline-block;background:#efe6ff;color:#5b3fa0;border-radius:10px;padding:4px 10px;font-weight:bold}.turn{font-size:1.2rem;font-weight:bold;color:#463183;margin:12px 0}.q{font-size:1.35rem;margin:12px 0 16px}.ans{display:block;width:100%;text-align:left;margin:8px 0;background:#f4f4fb;color:#29284a;border:3px solid #deddea}.ans.ok{background:#c8f3da;border-color:#2e9e62}.ans.ko{background:#ffd3d3;border-color:#d24a4a}.fb{min-height:26px;margin:12px 0;font-weight:bold}.scores{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:12px 0}.score-chip{background:#efe6ff;border-radius:14px;padding:9px 12px;font-weight:bold}.winner{font-size:1.2rem;color:#9a6500;font-weight:bold}.hidden{display:none}.err{color:#9d1727;font-weight:bold}footer{text-align:center;color:white;padding:4px 0 12px;font-size:.86rem}@media(max-width:550px){.wrap{padding:12px}.card{padding:17px}}
</style></head><body><main class="wrap"><h1>🧠 Quizz des explorateurs</h1><p class="sub">Un quiz pour toute la bande : chacun son âge, chacun son tour !</p>
<section id="home"><div class="card"><h2>1. Choisissez vos thèmes</h2><div class="themes" id="themes"></div><p class="center"><button class="alt" id="all">Tout sélectionner</button> <button class="alt" id="none">Tout effacer</button></p></div><div class="card"><h2>2. Préparez les joueurs</h2><div class="row"><div class="field"><label for="playerCount">Nombre de joueurs</label><select id="playerCount"></select></div><div class="field"><label for="nb">Questions par joueur : <span id="nbv">10</span></label><input type="range" id="nb" min="5" max="30" value="10"></div><div class="field"><label for="diff">Difficulté</label><select id="diff"><option value="">Toutes</option><option value="facile">Facile</option><option value="moyen">Moyenne</option><option value="difficile">Difficile</option></select></div></div><div id="players" class="players"></div><div class="profile-tools"><button type="button" class="alt" id="exportProfiles">Exporter les profils</button><button type="button" class="alt" id="importProfiles">Importer des profils</button><input class="hidden" type="file" id="profileFile" accept="application/json,.json" aria-label="Fichier JSON de profils"><button type="button" class="alt" id="resetProfiles">Réinitialiser les profils</button></div><p class="small" id="profileStatus" aria-live="polite"></p><p class="small" id="avail">Chargement des questions…</p><p class="center"><button id="start" disabled>🚀 Lancer le quizz</button></p></div></section>
<section id="game" class="card hidden"><div class="bar"><div id="prog"></div></div><div class="scores" id="liveScores" aria-live="polite"></div><div class="turn" id="turn"></div><span class="tag" id="qtheme"></span> <span class="small" id="qnum"></span><div class="q" id="qtext"></div><div id="answers"></div><div class="fb" id="fb" aria-live="polite"></div><p class="center"><button id="next" class="hidden">Suivant ➜</button></p></section><section id="end" class="card hidden center"><h2>🏁 Le quiz est terminé !</h2><div id="winner" class="winner"></div><div class="scores" id="finalScores"></div><p id="msg"></p><button id="replay">🔁 Rejouer avec les mêmes réglages</button> <button class="alt" id="home2">🏠 Retour à l'accueil</button></section><footer>Version <span id="version">chargement…</span></footer></main>
<script>'use strict';
const ICONS={'Nature':'🌿','Géographie':'🌍','Histoire':'🏰','Animaux':'🦁','Sciences':'🔬','Espace':'🚀','Corps humain':'🫀','Sport':'⚽','Arts et littérature':'🎨','Culture générale':'💡'},$=id=>document.getElementById(id);let QUESTIONS=[],THEMES=[],sel=new Set(),players=[],turns=[],idx=0,locked=false,profiles={},storageOK=true;const PROFILE_KEY='quizz.profiles.v1';const icon=t=>ICONS[t]||'❓';function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function nombreJoueurs(){return +$('playerCount').value||1}
function normalizeName(n){return String(n||'').trim().toLocaleLowerCase('fr')}function loadProfiles(){try{const raw=localStorage.getItem(PROFILE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed))profiles=parsed}}catch(e){storageOK=false;profiles={}}if(!storageOK)$('profileStatus').textContent='Stockage local indisponible : les profils ne seront pas conservés.'}function saveProfiles(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profiles));storageOK=true;$('profileStatus').textContent='Profils enregistrés sur cet appareil.';return true}catch(e){storageOK=false;$('profileStatus').textContent='Stockage local indisponible : le jeu continue, mais les profils ne sont pas enregistrés.';return false}}function profileFor(name,create){const key=normalizeName(name);if(!key)return null;if(!profiles[key]&&create)profiles[key]={name:String(name).trim(),age:null,history:{}};return profiles[key]||null}function syncPlayer(p){const pr=profileFor(p.name,true);if(pr){pr.name=String(p.name).trim();pr.age=Math.max(1,Math.min(99,+p.age||1));if(!pr.history||typeof pr.history!=='object'||Array.isArray(pr.history))pr.history={}}saveProfiles()}function renderPlayers(){const box=$('players'),n=nombreJoueurs();box.innerHTML='';while(players.length<n)players.push({name:'Joueur '+(players.length+1),age:players.length===0?35:8,score:0,quiz:[]});players=players.slice(0,n);players.forEach((p,i)=>{const c=document.createElement('div');c.className='player-config';const h=document.createElement('h3');h.textContent='👤 Joueur '+(i+1);const nl=document.createElement('label');nl.textContent='Prénom ou surnom';const name=document.createElement('input');name.type='text';name.maxLength=24;name.value=p.name;name.setAttribute('aria-label','Nom du joueur '+(i+1));name.setAttribute('list','profileNames');name.oninput=()=>{p.name=name.value.trim()||'Joueur '+(i+1);const pr=profileFor(name.value,false);if(pr&&pr.age){p.age=pr.age;age.value=pr.age}count()};name.onchange=()=>syncPlayer(p);const al=document.createElement('label');al.textContent='Âge';const age=document.createElement('input');age.type='number';age.min=1;age.max=99;age.value=p.age;age.setAttribute('aria-label','Âge du joueur '+(i+1));age.oninput=()=>{p.age=Math.max(1,Math.min(99,+age.value||1));const pr=profileFor(p.name,false);if(pr){pr.age=p.age;saveProfiles()}count()};age.onchange=()=>syncPlayer(p);c.append(h,nl,name,al,age);box.appendChild(c)});let dl=$('profileNames');if(!dl){dl=document.createElement('datalist');dl.id='profileNames';document.body.appendChild(dl)}dl.innerHTML='';Object.values(profiles).forEach(pr=>{if(pr&&pr.name){const o=document.createElement('option');o.value=pr.name;dl.appendChild(o)}});count()}
function eligible(){const d=$('diff').value;return QUESTIONS.filter(q=>sel.has(q.theme)&&(!d||q.difficulte===d))}function entryFor(pr,id){return pr&&pr.history?pr.history[String(id)]||null:null}function ageOrder(a,b,p){return Math.abs((+a.age||0)-p.age)-Math.abs((+b.age||0)-p.age)}function prepareQuizzes(){const all=eligible(),used=new Set(),now=Date.now(),requested=+$('nb').value;players.forEach(p=>{syncPlayer(p);const pr=profileFor(p.name,false),hist=pr.history||{},selected=[],local=new Set(),take=(list,n)=>{for(const q of list){if(selected.length>=n)return;if(!local.has(q.id)){selected.push(q);local.add(q.id)}}};const target=Math.min(requested,Math.round(requested*.30));const due=all.filter(q=>{const h=entryFor(pr,q.id);return h&&(+h.echecs>0||+h.vu>0)&&Number.isFinite(+h.due)&&+h.due<=now}).sort((a,b)=>{const x=entryFor(pr,a.id),y=entryFor(pr,b.id);return (+x.niveau||0)-(+y.niveau||0)||(+x.derniere||0)-(+y.derniere||0)});take(due.filter(q=>!used.has(q.id)),target);take(due,target);const fresh=shuffle(all.filter(q=>!entryFor(pr,q.id))).sort((a,b)=>ageOrder(a,b,p));take(fresh.filter(q=>!used.has(q.id)),requested);take(fresh,requested);const seen=all.filter(q=>entryFor(pr,q.id)).sort((a,b)=>{const x=entryFor(pr,a.id),y=entryFor(pr,b.id);return (+x.due||0)-(+y.due||0)||(+x.derniere||0)-(+y.derniere||0)});take(seen.filter(q=>!used.has(q.id)),requested);take(seen,requested);p.quiz=shuffle(selected);p.score=0;p.quiz.forEach(q=>used.add(q.id))});turns=[];for(let q=0;q<Math.max(...players.map(p=>p.quiz.length),0);q++)players.forEach((p,pi)=>{if(p.quiz[q])turns.push({pi,qi:q})});return turns}
function count(){if(!QUESTIONS.length)return;const n=eligible().length,p=+$('nb').value;$('avail').textContent=n+' questions disponibles pour '+players.length+' joueur(s), '+p+' par joueur. Les questions les plus proches de l’âge sont privilégiées ; doublons évités si possible.';$('start').disabled=!n||players.some(p=>!p.age||p.age<1||p.age>99)}function build(){const box=$('themes');box.innerHTML='';THEMES.forEach(k=>{const e=document.createElement('div');e.className='theme'+(sel.has(k)?' on':'');e.setAttribute('role','checkbox');e.setAttribute('aria-checked',sel.has(k));e.tabIndex=0;e.innerHTML='<span class="ic">'+icon(k)+'</span>'+esc(k)+'<small>'+QUESTIONS.filter(q=>q.theme===k).length+' questions</small>';const toggle=()=>{sel.has(k)?sel.delete(k):sel.add(k);build()};e.onclick=toggle;e.onkeydown=v=>{if(v.key==='Enter'||v.key===' '){v.preventDefault();toggle()}};box.appendChild(e)});count()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateScores(){$('liveScores').innerHTML=players.map(p=>'<span class="score-chip">'+esc(p.name)+': '+p.score+' / '+p.quiz.length+' ⭐</span>').join('')}
function start(){players.forEach(p=>syncPlayer(p));prepareQuizzes();idx=0;locked=false;$('home').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');updateScores();show()}function show(){const t=turns[idx],p=players[t.pi],q=p.quiz[t.qi];locked=false;$('prog').style.width=idx/turns.length*100+'%';$('turn').textContent='🎯 Au tour de '+p.name+' (joueur '+(t.pi+1)+')';$('qtheme').textContent=icon(q.theme)+' '+q.theme;$('qnum').textContent='Question '+(t.qi+1)+' / '+p.quiz.length;$('qtext').textContent=q.question;$('fb').textContent='';$('next').classList.add('hidden');const box=$('answers');box.innerHTML='';shuffle(q.reponses.map((t,i)=>({t,i}))).forEach(o=>{const b=document.createElement('button');b.className='ans';b.textContent=o.t;b.onclick=()=>answer(b,o.i===q.bonne,t.pi);b.dataset.ok=o.i===q.bonne?'1':'0';box.appendChild(b)})}function recordAnswer(p,q,ok,at){syncPlayer(p);const pr=profileFor(p.name,true),key=String(q.id),old=pr.history[key]||{},level=Math.max(0,Math.min(5,+old.niveau||0));const nextLevel=ok?Math.min(5,level+1):0,days=[1,3,7,21,60];pr.history[key]={vu:(+old.vu||0)+1,echecs:(+old.echecs||0)+(ok?0:1),niveau:nextLevel,derniere:at,dernierResultat:ok?'bonne':'mauvaise',due:ok?at+days[nextLevel-1]*86400000:at};saveProfiles()}function answer(btn,ok,pi){if(locked)return;locked=true;const turn=turns[idx],question=players[pi].quiz[turn.qi];recordAnswer(players[pi],question,ok,Date.now());document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('ok')});if(ok){players[pi].score++;$('fb').textContent='✅ Bravo ! '+players[pi].name+' marque un point !'}else{btn.classList.add('ko');$('fb').textContent='❌ Raté ! La bonne réponse est en vert.'}updateScores();$('next').textContent=idx===turns.length-1?'Voir le classement 🏆':'Au joueur suivant ➜';$('next').classList.remove('hidden')}function next(){if(++idx>=turns.length)finish();else show()}function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');const sorted=players.slice().sort((a,b)=>b.score-a.score),top=sorted[0],ties=sorted.filter(p=>p.score===top.score);$('finalScores').innerHTML=sorted.map((p,i)=>'<span class="score-chip">'+(i===0?'🏆 ':'')+(i+1)+'. '+esc(p.name)+' — '+p.score+' / '+p.quiz.length+'</span>').join('');$('winner').textContent=ties.length>1?'🤝 Égalité entre '+ties.map(p=>p.name).join(', ')+' !':'🏆 Bravo '+top.name+' !';$('msg').textContent='Chacun a joué son quiz adapté à son âge.'}
function validProfiles(data){if(!data||typeof data!=='object'||Array.isArray(data))throw Error('Le fichier doit contenir un objet de profils.');const out={};Object.entries(data).forEach(([key,v])=>{if(!v||typeof v!=='object'||typeof v.name!=='string'||!v.name.trim()||!v.history||typeof v.history!=='object'||Array.isArray(v.history))throw Error('Profil invalide : '+key);const normalized=normalizeName(v.name);if(key!==normalized)throw Error('Clé de profil incohérente : '+key);const history={};Object.entries(v.history).forEach(([id,h])=>{if(!h||typeof h!=='object'||!Number.isFinite(+h.vu)||!Number.isFinite(+h.echecs)||!Number.isInteger(+h.niveau)||+h.niveau<0||+h.niveau>5||!Number.isFinite(+h.derniere)||!Number.isFinite(+h.due)||!['bonne','mauvaise'].includes(h.dernierResultat))throw Error('Historique invalide pour la question '+id);history[id]={vu:+h.vu,echecs:+h.echecs,niveau:+h.niveau,derniere:+h.derniere,dernierResultat:h.dernierResultat,due:+h.due}});out[normalized]={name:v.name.trim(),age:v.age==null?null:Math.max(1,Math.min(99,+v.age||1)),history}});return out}function exportProfiles(){const blob=new Blob([JSON.stringify(profiles,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='quizz-profils.json';a.click();URL.revokeObjectURL(url)}function importProfilesFile(file){const reader=new FileReader();reader.onload=()=>{try{const imported=validProfiles(JSON.parse(reader.result)),merge=confirm('OK = fusionner avec les profils actuels (les imports remplacent les profils homonymes). Annuler = remplacer tous les profils.');profiles=merge?Object.assign({},profiles,imported):imported;saveProfiles();renderPlayers();$('profileStatus').textContent='Import terminé : '+Object.keys(imported).length+' profil(s) '+(merge?'fusionné(s).':'importé(s).')}catch(e){$('profileStatus').textContent='Import refusé : '+e.message}};reader.onerror=()=>{$('profileStatus').textContent='Impossible de lire le fichier.'};reader.readAsText(file)}$('exportProfiles').onclick=exportProfiles;$('importProfiles').onclick=()=>$('profileFile').click();$('profileFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)importProfilesFile(f);e.target.value=''};$('resetProfiles').onclick=()=>{if(confirm('Effacer définitivement tous les profils et historiques enregistrés sur cet appareil ?')){profiles={};saveProfiles();renderPlayers();$('profileStatus').textContent='Tous les profils ont été réinitialisés.'}};$('playerCount').innerHTML=Array.from({length:6},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+(i?' joueurs':' joueur')+'</option>').join('');$('playerCount').onchange=renderPlayers;$('nb').oninput=e=>{$('nbv').textContent=e.target.value;count()};$('diff').onchange=count;$('all').onclick=()=>{THEMES.forEach(k=>sel.add(k));build()};$('none').onclick=()=>{sel.clear();build()};$('start').onclick=start;$('next').onclick=next;$('replay').onclick=start;$('home2').onclick=()=>{$('end').classList.add('hidden');$('game').classList.add('hidden');$('home').classList.remove('hidden')};loadProfiles();renderPlayers();fetch('questions.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{if(!Array.isArray(d))throw Error('Format JSON inattendu');const seenIds=new Set();QUESTIONS=d.filter(q=>{if(!q||!Number.isInteger(q.id)||!q.theme||!q.question||!Array.isArray(q.reponses)||!Number.isInteger(q.bonne)||seenIds.has(q.id))return false;seenIds.add(q.id);return true});THEMES=[...new Set(QUESTIONS.map(q=>q.theme))];sel=new Set(THEMES);build()}).catch(e=>{$('avail').innerHTML='<span class="err">Impossible de charger questions.json ('+esc(e.message)+'). Ouvre via GitHub Pages ou un serveur local.</span>'});fetch('https://api.github.com/repos/NotoriousBig62/Misc/commits?path=QUIZZ&per_page=1',{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw Error('API indisponible');return r.json()}).then(d=>{if(!Array.isArray(d)||!d[0]?.sha)throw Error('Commit indisponible');$('version').textContent=d[0].sha.slice(0,7)}).catch(()=>$('version').textContent='non disponible');
</script></body></html>
