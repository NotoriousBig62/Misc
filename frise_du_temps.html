/* Échelle non linéaire par segments : [bp_debut(ancien), bp_fin(récent), largeur_px] */

 [Ga(13.8),Ga(4.6),1100],
 [Ga(4.6),Ga(0.541),1500],
 [Ma(541),Ma(66),1500],
 [Ma(66),Ma(2.58),1300],
 [Ma(2.58),ka(12),1300],
 [ka(12),Y(-3000),1300],
 [Y(-3000),Y(500),1400],
 [Y(500),Y(1500),1300],
 [Y(1500),Y(1800),1300],
 [Y(1800),0,2600]
];
const TOTAL=SCALE.reduce((a,s)=>a+s[2],0);
let zoom=1;
function pos(bp){
 let x=0;
 for(const [a,b,w] of SCALE){
  if(bp<=a && bp>=b){return (x+(a-bp)/(a-b)*w)*zoom}
  x+=w;
 }
 return bp>SCALE[0][0]?0:TOTAL*zoom;
}

/* ===== Rendu ===== */
const view=document.getElementById('view'),tl=document.getElementById('tl'),mini=document.getElementById('mini'),win=document.getElementById('win'),axis=document.getElementById('axis');
const panel=document.getElementById('panel');
const active=new Set(Object.keys(CAT));

function fmt(bp){
 if(bp>=1e9)return (bp/1e9).toFixed(1).replace('.',',')+' Ga';
 if(bp>=1e6)return Math.round(bp/1e6)+' Ma';
 if(bp>=1e4)return Math.round(bp/1e3)+' ka';
 const y=NOW-bp; return y<=0?(-y+' av. J.-C.'):String(Math.round(y));
}
function render(){
 tl.style.width=TOTAL*zoom+'px';
 tl.querySelectorAll('.seg,.ev,.tick').forEach(n=>n.remove());
 // Segments
 const all=P.concat(P2);
 all.forEach(([n,a,b,c,l])=>{
  const d=document.createElement('div');
  d.className='seg'+(l==2?' row2':l==3?' row3':'');
  if(l==1)d.style.top='70px';
  const x1=pos(a),x2=pos(b);
  d.style.left=x1+'px';d.style.width=Math.max(2,x2-x1)+'px';d.style.background=c;d.textContent=n;d.title=n+' ('+fmt(a)+' → '+fmt(b)+')';
  tl.appendChild(d);
 });
 // Graduations
 const ticks=[];
 SCALE.forEach(([a,b,w])=>{
  const n=Math.max(4,Math.round(w*zoom/160));
  for(let i=0;i<n;i++){ticks.push(a-(a-b)*i/n)}
 });
 ticks.push(0);
 ticks.forEach(bp=>{
  const t=document.createElement('div');t.className='tick';t.style.left=pos(bp)+'px';t.textContent=fmt(bp);axis.appendChild(t);
 });
 // Événements
 const evs=E.filter(e=>active.has(e[2])).sort((a,b)=>b[1]-a[1]);
 const lastEnd=[];const base=190,H=view.clientHeight||500;
 const lanes=Math.max(4,Math.floor((H-base-20)/22));
 evs.forEach(e=>{
  const x=pos(e[1]);
  const w=e[0].length*6.5+14;
  let lane=0;
  while(lane<lanes && lastEnd[lane]>x-2)lane++;
  if(lane>=lanes)lane=lanes-1;
  lastEnd[lane]=x+w;
  const d=document.createElement('div');d.className='ev';d.style.left=x+'px';d.style.setProperty('--c',CAT[e[2]][1]);
  const top=base+lane*22;
  d.innerHTML='<div class="stem" style="top:'+(base-8)+'px;height:'+(lane*22+8)+'px"></div><div class="dot" style="top:'+(base-14)+'px"></div><div class="lbl" style="top:'+top+'px">'+e[0]+'</div>';
  d.onclick=()=>show(e);d._e=e;
  tl.appendChild(d);
 });
 drawMini();updWin();
}
function show(e){
 pc.textContent=CAT[e[2]][0];pt.textContent=e[0];pd.textContent=e[3];pp.textContent=e[4];panel.style.display='block';
}
function drawMini(){
 mini.querySelectorAll('.m,.e').forEach(n=>n.remove());
 const W=mini.clientWidth;
 P.filter(p=>p[4]==1).forEach(([n,a,b,c])=>{
  const d=document.createElement('div');d.className='m';
  const f=v=>pos(v)/zoom/TOTAL*W;
  d.style.left=f(a)+'px';d.style.width=Math.max(2,f(b)-f(a))+'px';d.style.background=c;mini.appendChild(d);
 });
 E.forEach(e=>{const d=document.createElement('div');d.className='e';d.style.left=(pos(e[1])/zoom/TOTAL*mini.clientWidth)+'px';mini.appendChild(d)});
}
function updWin(){
 const W=mini.clientWidth,tot=tl.scrollWidth||1;
 win.style.left=(view.scrollLeft/tot*W)+'px';
 win.style.width=(view.clientWidth/tot*W)+'px';
}
view.addEventListener('scroll',updWin);
mini.addEventListener('click',ev=>{
 const r=mini.getBoundingClientRect();
 view.scrollLeft=(ev.clientX-r.left)/r.width*tl.scrollWidth-view.clientWidth/2;
});
function setZoom(z,cx){
 const rel=(view.scrollLeft+(cx??view.clientWidth/2))/zoom;
 zoom=Math.min(6,Math.max(0.3,z));render();
 view.scrollLeft=rel*zoom-(cx??view.clientWidth/2);
}
zi.onclick=()=>setZoom(zoom*1.4);zo.onclick=()=>setZoom(zoom/1.4);
view.addEventListener('wheel',e=>{
 if(e.ctrlKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15),e.clientX)}
 else{e.preventDefault();view.scrollLeft+=e.deltaY+e.deltaX}
},{passive:false});
let dr=false,sx=0,sl=0;
view.addEventListener('mousedown',e=>{dr=true;sx=e.clientX;sl=view.scrollLeft;view.classList.add('drag')});
window.addEventListener('mouseup',()=>{dr=false;view.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(dr)view.scrollLeft=sl-(e.clientX-sx)});
window.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight')view.scrollLeft+=200;
 if(e.key==='ArrowLeft')view.scrollLeft-=200;
 if(e.key==='+')setZoom(zoom*1.4);
 if(e.key==='-')setZoom(zoom/1.4);
});
// Sauts
[["Big Bang",Ga(13.8)],["Terre",Ga(4.5)],["Vie",Ga(3.8)],["Dinosaures",Ma(230)],["Humanité",Ma(3)],["Antiquité",Y(-3300)],["Moyen Âge",Y(476)],["Moderne",Y(1492)],["Aujourd'hui",0]].forEach(([n,bp])=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{view.scrollTo({left:pos(bp)-80,behavior:'smooth'})};jump.appendChild(b);
});
// Filtres
Object.entries(CAT).forEach(([k,[n,c]])=>{
 const b=document.createElement('button');b.textContent=n;b.style.borderColor=c;
 b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.classList.toggle('off');render()};
 filters.appendChild(b);
});
// Recherche
q.addEventListener('input',()=>{
 const s=q.value.trim().toLowerCase();let first=null;
 tl.querySelectorAll('.ev').forEach(d=>{
  const hit=s&&(d._e[0].toLowerCase().includes(s)||d._e[4].toLowerCase().includes(s));
  d.classList.toggle('hl',!!hit);if(hit&&!first)first=d;
 });
 if(first)view.scrollTo({left:parseFloat(first.style.left)-200,behavior:'smooth'});
});
window.addEventListener('resize',render);
render();
view.scrollLeft=0;
</script>
