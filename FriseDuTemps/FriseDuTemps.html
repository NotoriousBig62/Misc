const Y=y=>NOW-y; // année calendaire -> BP (négatif = av. J.-C.)

 [Ga(13.8),Ga(4.5),700],
 [Ga(4.5),Ga(0.541),800],
 [Ma(541),Ma(66),900],
 [Ma(66),Ma(2.6),700],
 [Ma(2.6),Ka(12),900],
 [Ka(12),Y(-3300),700],
 [Y(-3300),Y(476),900],
 [Y(476),Y(1492),700],
 [Y(1492),0,1100]
];

const START=SCALE[0][0];
let zoom=1, linear=false;
const LIN_PX_PER_YEAR=0.001; // 1 px = 1000 ans

function pos(bp){
 if(linear)return (START-bp)*LIN_PX_PER_YEAR*zoom;
 let x=0;
 for(const [a,b,w] of SCALE){
  if(bp<=a&&bp>=b)return (x+(a-bp)/(a-b)*w)*zoom;
  x+=w;
 }
 return bp>START?0:TOTAL*zoom;
}
function totalW(){return linear?START*LIN_PX_PER_YEAR*zoom:TOTAL*zoom}

const view=document.getElementById('view'),tl=document.getElementById('tl'),
 axis=document.getElementById('axis'),mini=document.getElementById('mini'),
 info=document.getElementById('info'),q=document.getElementById('q'),
 lin=document.getElementById('lin'),jump=document.getElementById('jump'),
 filters=document.getElementById('filters');

function fmt(bp){
 if(bp>=1e9)return (bp/1e9).toFixed(1).replace('.0','')+' Ga';
 if(bp>=1e6)return Math.round(bp/1e6)+' Ma';
 if(bp>=1e4)return Math.round(bp/1e3)+' ka';
 const y=NOW-bp;
 return y<=0?Math.abs(Math.round(y))+' av. J.-C.':Math.round(y);
}

function addSegs(rows,top){
 rows.forEach(([n,a,b,c])=>{
  const x1=pos(a),x2=pos(b);
  if(x2-x1<1)return;
  const d=document.createElement('div');
  d.className='seg';d.style.cssText=`left:${x1}px;width:${x2-x1}px;top:${top}px;background:${c}`;
  d.textContent=n;d.title=n;tl.appendChild(d);
 });
}

function render(){
 tl.querySelectorAll('.seg,.ev').forEach(n=>n.remove());
 axis.innerHTML='';
 tl.style.width=totalW()+'px';

 // Graduations
 const ticks=[];
 if(linear){
  const n=Math.max(10,Math.round(totalW()/160));
  for(let i=0;i<n;i++)ticks.push(START*(1-i/n));
 }else{
  SCALE.forEach(([a,b,w])=>{
   const n=Math.max(4,Math.round(w*zoom/160));
   for(let i=0;i<n;i++)ticks.push(a-(a-b)*i/n);
  });
 }
 ticks.push(0);
 ticks.forEach(t=>{
  const d=document.createElement('div');d.className='tick';
  d.style.left=pos(t)+'px';d.textContent=fmt(t);axis.appendChild(d);
 });

 // Bandes d'ères
 addSegs(ROW1,72);addSegs(ROW2,104);addSegs(ROW3,136);addSegs(ROW4,168);

 // Événements (alternance sur plusieurs niveaux pour limiter les chevauchements)
 const evs=E.filter(e=>active.has(e[2])).sort((a,b)=>b[1]-a[1]);
 const H=view.clientHeight;
 const baseTop=210, levels=Math.max(4,Math.floor((H-baseTop-20)/22));
 const lastX=new Array(levels).fill(-1e9);
 evs.forEach(e=>{
  const x=pos(e[1]);
  let lv=0;
  for(let i=0;i<levels;i++){if(x-lastX[i]>110){lv=i;break}lv=i}
  lastX[lv]=x;
  const top=baseTop+lv*22;
  const d=document.createElement('div');d.className='ev';d._e=e;
  d.style.left=x+'px';d.style.top=top+'px';d.style.setProperty('--c',CAT[e[2]][1]);
  d.innerHTML=`<div class="dot"></div><div class="lbl">${e[0]}</div>`;
  d.onclick=()=>{
   document.getElementById('it').textContent=e[0];
   document.getElementById('id').textContent=e[3]+' · '+CAT[e[2]][0];
   document.getElementById('ip').textContent=e[4];
   info.style.display='block';
  };
  tl.appendChild(d);
 });
 drawMini();
}

function drawMini(){
 mini.innerHTML='';
 const W=mini.clientWidth;
 E.forEach(e=>{
  const d=document.createElement('div');d.className='e';
  d.style.left=(pos(e[1])/totalW()*W)+'px';mini.appendChild(d);
 });
 const vp=document.createElement('div');vp.className='vp';vp.id='vp';mini.appendChild(vp);
 updVp();
}
function updVp(){
 const vp=document.getElementById('vp');if(!vp)return;
 const W=mini.clientWidth,t=totalW();
 vp.style.left=(view.scrollLeft/t*W)+'px';
 vp.style.width=Math.max(4,view.clientWidth/t*W)+'px';
}
view.addEventListener('scroll',updVp);
mini.addEventListener('click',e=>{
 const r=mini.getBoundingClientRect();
 view.scrollLeft=(e.clientX-r.left)/r.width*totalW()-view.clientWidth/2;
});

// Zoom
function setZoom(z){
 const c=(view.scrollLeft+view.clientWidth/2)/totalW();
 zoom=Math.max(0.3,Math.min(6,z));
 render();
 view.scrollLeft=c*totalW()-view.clientWidth/2;
}
document.getElementById('zin').onclick=()=>setZoom(zoom*1.4);
document.getElementById('zout').onclick=()=>setZoom(zoom/1.4);
view.addEventListener('wheel',e=>{
 if(e.ctrlKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15));}
 else if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();view.scrollLeft+=e.deltaY*2;}
},{passive:false});

// Glisser-déposer
let dr=false,sx=0,sl=0;
view.addEventListener('mousedown',e=>{dr=true;sx=e.clientX;sl=view.scrollLeft;view.classList.add('drag')});
window.addEventListener('mouseup',()=>{dr=false;view.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(dr)view.scrollLeft=sl-(e.clientX-sx)});
window.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight')view.scrollLeft+=200;
 if(e.key==='ArrowLeft')view.scrollLeft-=200;
 if(e.key==='+')setZoom(zoom*1.4);
 if(e.key==='-')setZoom(zoom/1.4);
});

// Boutons de saut
[["Big Bang",Ga(13.8)],["Terre",Ga(4.5)],["Vie",Ga(3.8)],["Dinosaures",Ma(230)],
 ["Humanité",Ma(7)],["Antiquité",Y(-3300)],["Moyen Âge",Y(476)],
 ["Moderne",Y(1492)],["Aujourd'hui",0]].forEach(([n,bp])=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>view.scrollTo({left:pos(bp)-80,behavior:'smooth'});
 jump.appendChild(b);
});

// Filtres
Object.entries(CAT).forEach(([k,[n,c]])=>{
 const b=document.createElement('button');b.textContent=n;b.style.borderColor=c;
 b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.classList.toggle('off');render()};
 filters.appendChild(b);
});

// Recherche
q.addEventListener('input',()=>{
 const s=q.value.trim().toLowerCase();let first=null;
 tl.querySelectorAll('.ev').forEach(d=>{
  const hit=s&&(d._e[0].toLowerCase().includes(s)||d._e[4].toLowerCase().includes(s));
  d.classList.toggle('hl',!!hit);
  if(hit&&!first)first=d;
 });
 if(first)view.scrollTo({left:parseFloat(first.style.left)-200,behavior:'smooth'});
});

// Échelle linéaire
lin.addEventListener('change',()=>{
 linear=lin.checked;zoom=1;render();view.scrollLeft=0;
});

window.addEventListener('resize',render);
render();
</script>
</body>
