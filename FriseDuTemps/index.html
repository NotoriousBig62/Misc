<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frise du Temps</title>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--line:#263552;--text:#e9f0ff;--muted:#9aa9c5;--accent:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0e1528;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;white-space:nowrap}
.controls{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
button,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
input{width:190px;outline:none}
input:focus{border-color:var(--accent)}
#filters{display:flex;gap:6px;overflow:auto}
#filters button{font-size:12px;padding:5px 8px}
#filters button.off{opacity:.4;text-decoration:line-through}
#jump{display:flex;gap:6px;overflow:auto}
#jump button{font-size:12px;padding:5px 8px}
#zoom{width:120px}
#view{height:calc(100vh - 64px);overflow:auto;position:relative;cursor:grab}
#view.drag{cursor:grabbing}
#world{position:relative;height:100%;min-height:520px}
#axis{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,#7dd3fc,#c4b5fd,#fda4af);transform:translateY(-50%)}
#axis:before,#axis:after{content:'';position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 12px #7dd3fc}
#axis:before{left:0}#axis:after{right:0}
.tick{position:absolute;top:50%;height:18px;width:1px;background:#587093;transform:translateY(-50%)}
.tick span{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.ev{position:absolute;width:190px;padding:10px 11px;background:linear-gradient(145deg,#17233d,#101a30);border:1px solid var(--c);border-radius:10px;box-shadow:0 8px 24px #0005;transition:opacity .2s,transform .2s;cursor:pointer}
.ev:hover,.ev.hl{transform:scale(1.04);z-index:20;box-shadow:0 0 18px color-mix(in srgb,var(--c),transparent 45%)}
.ev h3{margin:0 0 4px;font-size:13px;line-height:1.25;color:#fff}
.ev .date{font-size:11px;color:var(--c);margin-bottom:5px}
.ev p{margin:0;color:#b8c5de;font-size:11px;line-height:1.35}
.ev:after{content:'';position:absolute;left:50%;width:1px;background:var(--c);opacity:.7}
.ev.up{bottom:calc(50% + 34px)}.ev.up:after{top:100%;height:34px}
.ev.down{top:calc(50% + 34px)}.ev.down:after{bottom:100%;height:34px}
#loadError{display:none;position:fixed;z-index:30;top:76px;left:50%;transform:translateX(-50%);max-width:90vw;padding:12px 16px;color:#ffe4e6;background:#7f1d1d;border:1px solid #fb7185;border-radius:10px}
@media(max-width:900px){header{height:auto;min-height:64px;flex-wrap:wrap;padding:10px}header h1{font-size:16px}.controls{flex-wrap:wrap}#filters,#jump{max-width:100%}#view{height:calc(100vh - 100px)}.ev{width:165px}}
</style>
</head>
<body>
<header>
 <h1>Frise du Temps</h1>
 <div class="controls">
  <input id="q" placeholder="Rechercher…" aria-label="Rechercher">
  <div id="filters"></div>
  <div id="jump"></div>
  <label>Zoom <input id="zoom" type="range" min="0.5" max="3" step="0.1" value="1"></label>
 </div>
</header>
<div id="loadError"></div>
<div id="view"><div id="world"><div id="axis"></div></div></div>
<script>
const view=document.getElementById('view'), world=document.getElementById('world'), tl=document.getElementById('world');
const q=document.getElementById('q'), filters=document.getElementById('filters'), jump=document.getElementById('jump'), zr=document.getElementById('zoom');
const CAT={cosmos:['Cosmos','#7dd3fc'],terre:['Terre','#86efac'],vie:['Vie','#f9a8d4'],histoire:['Histoire','#fcd34d']};
let eventsData=[], active=new Set(Object.keys(CAT)), zoom=1;
const Ma=n=>-n*1e6, Ga=n=>-n*1e9, Y=n=>n;
function pos(bp){return (bp+13.8e9)/13.8e9*world.scrollWidth}
function date(bp){if(bp< -1e9)return (Math.abs(bp)/1e9).toFixed(1)+' Ga';if(bp<0)return Math.abs(bp/1e6).toFixed(0)+' Ma';return Math.round(bp)+' CE'}
function render(){
 const w=Math.max(view.clientWidth*2,Math.round(view.clientWidth*2*zoom));world.style.width=w+'px';
 const axis=world.querySelector('#axis');world.querySelectorAll('.tick,.ev').forEach(e=>e.remove());
 for(let i=0;i<=10;i++){const x=i/10*w,t=document.createElement('div');t.className='tick';t.style.left=x+'px';t.innerHTML='<span>'+date(-13.8e9+i*1.38e9)+'</span>';world.appendChild(t)}
 eventsData.forEach((e,i)=>{
  if(!active.has(e.cat))return;
  const x=pos(e.bp),d=document.createElement('article');d.className='ev '+(i%2?'down':'up');d.style.setProperty('--c',CAT[e.cat][1]);d.style.left=Math.max(4,Math.min(w-194,x-95))+'px';
  d.innerHTML='<h3>'+e.name+'</h3><div class="date">'+e.date+'</div><p>'+e.desc+'</p>';d._e=e;world.appendChild(d);
 });
}
function setZoom(v,anchorX){zoom=Math.max(.5,Math.min(3,v));zr.value=zoom;let before=view.scrollLeft+(anchorX||view.clientWidth/2);render();view.scrollLeft=before*zoom/(parseFloat(zr.value)||1)}
zr.addEventListener('input',()=>{const old=zoom;zoom=parseFloat(zr.value);const x=view.clientWidth/2,ratio=zoom/old;render();view.scrollLeft=(view.scrollLeft+x)*ratio-x});
view.addEventListener('wheel',e=>{
 if(e.ctrlKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15),e.clientX)}
 else{e.preventDefault();view.scrollLeft+=e.deltaY+e.deltaX}
},{passive:false});
let dr=false,sx=0,sl=0;
view.addEventListener('mousedown',e=>{dr=true;sx=e.clientX;sl=view.scrollLeft;view.classList.add('drag')});
window.addEventListener('mouseup',()=>{dr=false;view.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(dr)view.scrollLeft=sl-(e.clientX-sx)});
window.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight')view.scrollLeft+=200;
 if(e.key==='ArrowLeft')view.scrollLeft-=200;
 if(e.key==='+')setZoom(zoom*1.4);
 if(e.key==='-')setZoom(zoom/1.4);
});
// Sauts
[["Big Bang",Ga(13.8)],["Terre",Ga(4.5)],["Vie",Ga(3.8)],["Dinosaures",Ma(230)],["Humanité",Ma(3)],["Antiquité",Y(-3300)],["Moyen Âge",Y(476)],["Moderne",Y(1492)],["Aujourd'hui",0]].forEach(([n,bp])=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{view.scrollTo({left:pos(bp)-80,behavior:'smooth'})};jump.appendChild(b);
});
// Filtres
Object.entries(CAT).forEach(([k,[n,c]])=>{
 const b=document.createElement('button');b.textContent=n;b.style.borderColor=c;
 b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.classList.toggle('off');render()};filters.appendChild(b);
});
// Recherche
q.addEventListener('input',()=>{
 const s=q.value.trim().toLowerCase();let first=null;
 tl.querySelectorAll('.ev').forEach(d=>{
  const hit=s&&(d._e.name.toLowerCase().includes(s)||d._e.desc.toLowerCase().includes(s));
  d.classList.toggle('hl',!!hit);if(hit&&!first)first=d;
 });
 if(first)view.scrollTo({left:parseFloat(first.style.left)-200,behavior:'smooth'});
});
window.addEventListener('resize',render);
async function init(){
 try{
  const response=await fetch('events.json');
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data) || data.some(e=>!e || typeof e.name!=='string' || typeof e.bp!=='number' || typeof e.cat!=='string' || typeof e.date!=='string' || typeof e.desc!=='string'))throw new Error('Format JSON inattendu');
  eventsData=data;
  render();
  view.scrollLeft=0;
 }catch(error){
  const box=document.getElementById('loadError');
  box.textContent='Impossible de charger les événements. Ouvrez cette page depuis un serveur web local ou en ligne (pas en file://), puis réessayez. '+error.message;
  box.style.display='block';
  console.error('Chargement des événements impossible:',error);
 }
}
init();
</script>
<!-- Version affichée : SHA du commit précédent ; le fichier ne peut pas contenir le hash de son propre commit. -->

</body>
</html>
