<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frise du temps</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#10151c;color:#e8edf2}body{display:flex;flex-direction:column;overflow:hidden}header{padding:12px 16px;background:#18212b;border-bottom:1px solid #2d3947;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0;font-weight:650}button,input{font:inherit;color:inherit;background:#222e3a;border:1px solid #39495a;border-radius:6px;padding:6px 10px}button{cursor:pointer}button:hover{background:#2c3d4e}input{min-width:190px}#filters{display:flex;gap:5px;flex-wrap:wrap}#filters button{font-size:12px;padding:4px 7px;border-width:2px}#filters button.off{opacity:.4;text-decoration:line-through}#controls{display:flex;gap:5px;align-items:center;margin-left:auto}#linearScale{width:16px;height:16px;min-width:0}label{font-size:12px;display:flex;align-items:center;gap:4px}#jump{display:flex;gap:4px;flex-wrap:wrap}#jump button{font-size:11px;padding:3px 6px}
#view{position:relative;flex:1;overflow:auto;cursor:grab;background:#10151c;scrollbar-color:#506174 #18212b}#view.drag{cursor:grabbing}#tl{position:relative;height:100%;min-height:500px;background:linear-gradient(to bottom,transparent 0,transparent 135px,#24303b 135px,#24303b 137px,transparent 137px)}#axis{position:absolute;top:0;left:0;height:48px;border-bottom:1px solid #3b4855}#axis .tick{position:absolute;top:0;height:48px;border-left:1px solid #33404b;padding:4px 3px;font-size:10px;color:#aab5c0;white-space:nowrap}#axis .tick:before{content:"";position:absolute;bottom:0;left:-1px;height:7px;border-left:1px solid #72808d}
.seg{position:absolute;top:52px;height:28px;border-radius:4px;border:1px solid #ffffff42;overflow:hidden;cursor:pointer;z-index:2;min-width:2px}.seg.row2{top:84px;height:25px}.seg.row3{top:113px;height:22px}.seg.row4{top:139px;height:20px}.segLabel{font-size:10px;white-space:nowrap;padding:2px 4px;display:block;text-shadow:0 1px 2px #000;pointer-events:none}.seg:hover{filter:brightness(1.25);z-index:5}
.ev{position:absolute;top:0;z-index:4;cursor:pointer}.stem{position:absolute;left:4px;width:1px;background:var(--c);opacity:.55}.dot{position:absolute;left:0;width:9px;height:9px;border-radius:50%;background:var(--c);border:1px solid #fff}.lbl{position:absolute;left:7px;white-space:nowrap;font-size:10px;color:#d5dbe1;background:#10151ce8;padding:1px 3px;border-radius:3px;border-left:2px solid var(--c);max-width:180px;overflow:hidden;text-overflow:ellipsis}.ev:hover{z-index:7}.ev:hover .lbl,.ev.hl .lbl{color:white;background:#33404b;max-width:none}.ev.hl .dot{box-shadow:0 0 0 4px #ffffff50}
#miniWrap{height:46px;background:#18212b;border-top:1px solid #2d3947;padding:7px 12px;flex:none}#mini{height:30px;position:relative;background:#252f39;border-radius:4px;overflow:hidden}.m{position:absolute;top:3px;height:8px;opacity:.8;border-radius:2px}.e{position:absolute;top:14px;width:2px;height:10px;background:#e4c45c}.win{position:absolute;top:0;height:100%;border:2px solid #fff9;background:#ffffff12;cursor:grab;min-width:12px;border-radius:3px}.win.dragging{cursor:grabbing}#panel{display:none;position:fixed;right:16px;top:76px;width:min(360px,calc(100vw - 32px));max-height:65vh;overflow:auto;background:#202b36;border:1px solid #465565;border-radius:10px;padding:14px;z-index:12;box-shadow:0 10px 35px #0009}#panel h2{font-size:16px;margin:0 0 6px}#panel p{font-size:13px;line-height:1.45;margin:5px 0}#imgTip{display:none;position:fixed;z-index:20;width:min(320px,80vw);background:#202b36;border:1px solid #607080;border-radius:8px;padding:7px;pointer-events:none;box-shadow:0 8px 28px #0009}#imgTip .imageArea{height:180px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#b9c5d0}#imgTip img{max-width:100%;max-height:100%;object-fit:contain}#imgTip .caption{font-size:12px;font-weight:600;padding-top:4px}#out{display:none}
</style>
</head>
<body>
<header>
<h1>Frise du temps</h1>
<input id="q" placeholder="Rechercher un événement…" aria-label="Rechercher">
<div id="filters"></div>
<div id="jump"></div>
<div id="controls"><label><input id="linearScale" type="checkbox" checked>Échelle linéaire</label><button id="zo" title="Zoom arrière">−</button><button id="zi" title="Zoom avant">+</button><button id="out">Retour</button></div>
</header>
<div id="loadError" role="alert" style="display:none;position:fixed;inset:12px 12px auto;background:#7b2525;color:#fff;padding:12px;border-radius:8px;z-index:30"></div>
<div id="view"><div id="tl"><div id="axis"></div></div></div>
<div id="miniWrap"><div id="mini"><div id="win" class="win"></div></div></div>
<div id="panel"><h2 id="pt"></h2><p id="pc"></p><p id="pd"></p><p id="pp"></p></div>
<div id="imgTip"><div class="imageArea"></div><div class="caption"></div></div>
<script>
const NOW=2026, START=13.8e9, TOTAL=30000;
let zoom=1,linearScale=true,focusOverride=false;
const Ga=x=>x*1e9,Ma=x=>x*1e6,ka=x=>x*1e3,Y=x=>NOW-x;
const SCALE=[[13.8e9,4.6e9,9000],[4.6e9,541e6,7500],[541e6,66e6,4500],[66e6,0,9000]];
function pos(bp){
 if(linearScale&&!focusOverride){
  if(bp>START)return 0;
  if(bp<0)return TOTAL*zoom;
  return (START-bp)/START*TOTAL*zoom;
 }
 let x=0;
 for(const [a,b,w] of SCALE){if(bp<=a&&bp>=b)return (x+(a-bp)/(a-b)*w)*zoom;x+=w;}
 return bp>START?0:TOTAL*zoom;
}
function bpAt(px){
 const x=px/zoom;
 if(linearScale&&!focusOverride)return START*(1-x/TOTAL);
 let acc=0;
 for(const [a,b,w] of SCALE){if(x<=acc+w)return a-(x-acc)/w*(a-b);acc+=w;}
 return 0;
}
const CAT={cosmos:['Cosmos','#b388ff'],terre:['Terre','#ff8a65'],vie:['Vie','#66bb6a'],humain:['Humanité','#ffca28'],civ:['Civilisations','#42a5f5'],pol:['Politique/Guerre','#ef5350'],sci:['Sciences/Tech','#26c6da'],art:['Arts/Religion','#ec407a']};
let eventsData=[],periodInfo=[];
/* ===== Rendu ===== */
const view=document.getElementById('view'),tl=document.getElementById('tl'),mini=document.getElementById('mini'),win=document.getElementById('win'),axis=document.getElementById('axis');
const panel=document.getElementById('panel');
const imgTip=document.getElementById('imgTip'),imgTipArea=imgTip.querySelector('.imageArea'),imgTipCaption=imgTip.querySelector('.caption');
let tipTarget=null,tipRequest=0,tipX=0,tipY=0;
function hideImgTip(){tipRequest++;tipTarget=null;imgTip.style.display='none';}
function positionImgTip(){const margin=12,offset=14,r=imgTip.getBoundingClientRect();imgTip.style.left=Math.max(margin,Math.min(tipX+offset,window.innerWidth-r.width-margin))+'px';imgTip.style.top=Math.max(margin,Math.min(tipY+offset,window.innerHeight-r.height-margin))+'px';}
function bindImgTip(node,entry){if(!entry||!entry.img)return;node.addEventListener('mouseenter',e=>{hideImgTip();tipTarget=node;const request=tipRequest;tipX=e.clientX;tipY=e.clientY;imgTipCaption.textContent=entry.name;imgTipArea.textContent='Chargement…';imgTip.style.display='block';positionImgTip();const image=new Image();image.alt=entry.name;image.onload=()=>{if(tipTarget!==node||tipRequest!==request)return;imgTipArea.replaceChildren(image);positionImgTip();};image.onerror=()=>{if(tipTarget!==node||tipRequest!==request)return;imgTipArea.textContent='Image indisponible';positionImgTip();};image.src=entry.img;});node.addEventListener('mousemove',e=>{if(tipTarget!==node)return;tipX=e.clientX;tipY=e.clientY;positionImgTip();});node.addEventListener('mouseleave',()=>{if(tipTarget===node)hideImgTip();});}
const active=new Set(Object.keys(CAT));
function fmt(bp){if(bp>=1e9)return (bp/1e9).toFixed(1).replace('.',',').replace(/,0$/,'')+' Ga';if(bp>=1e6)return Math.round(bp/1e6)+' Ma';if(bp>=1e4)return Math.round(bp).toLocaleString('fr-FR').replace(/\u202f/g,' ')+' a';const y=Math.round(NOW-bp);return y<=0?(Math.abs(y)+' av. J.-C.'):String(y);}
function render(){
 hideImgTip();tl.style.width=TOTAL*zoom+'px';tl.querySelectorAll('.seg,.ev,.tick').forEach(n=>n.remove());
 const all=periodInfo.map(p=>[p.name,p.startBp,p.endBp,p.color,p.level]);all.forEach(([n,a,b,c,l])=>{const d=document.createElement('div');d.className='seg'+(l==2?' row2':l==3?' row3':l==4?' row4':'');if(l==1)d.style.top='70px';const x1=pos(a),x2=pos(b);d.style.left=x1+'px';d.style.width=Math.max(2,x2-x1)+'px';d.style.background=c;const label=document.createElement('span');label.className='segLabel';label.textContent=n;d.appendChild(label);d.title=n+' ('+fmt(a)+' → '+fmt(b)+')';const info=periodInfo.find(e=>e.name===n);bindImgTip(d,info);d._period={name:n,start:a,end:b,color:c,info};d.addEventListener('click',()=>{if(draggedView){draggedView=false;return;}showPeriod(d._period);});tl.appendChild(d);});
 const ticks=[];if(linearScale&&!focusOverride){const raw=START/Math.max(4,Math.min(1000,Math.round(TOTAL*zoom/160)));const pow=10**Math.floor(Math.log10(raw)),ratio=raw/pow;const step=(ratio<=1?1:ratio<=2?2:ratio<=5?5:10)*pow;for(let bp=START;bp>0;bp-=step)ticks.push(bp);ticks.push(0);}else{SCALE.forEach(([a,b,w])=>{const n=Math.max(4,Math.round(w*zoom/160));for(let i=0;i<n;i++)ticks.push(a-(a-b)*i/n);});ticks.push(0);}
 ticks.forEach(bp=>{const t=document.createElement('div');t.className='tick';t.style.left=pos(bp)+'px';t.textContent=fmt(bp);axis.appendChild(t);});
 const evs=eventsData.filter(e=>e.type!=='period'&&active.has(e.cat)).sort((a,b)=>b.bp-a.bp);const lastEnd=[];const base=190,H=view.clientHeight||500;const lanes=Math.max(4,Math.floor((H-base-20)/22));
 evs.forEach(e=>{const x=pos(e.bp),w=e.name.length*6.5+14;let lane=0;while(lane<lanes&&lastEnd[lane]>x-2)lane++;if(lane>=lanes)lane=lanes-1;lastEnd[lane]=x+w;const d=document.createElement('div');d.className='ev';d.style.left=x+'px';d.style.setProperty('--c',CAT[e.cat][1]);const top=base+lane*22;d.innerHTML='<div class="stem" style="top:'+(base-8)+'px;height:'+(lane*22+8)+'px"></div><div class="dot" style="top:'+(base-14)+'px"></div><div class="lbl" style="top:'+top+'px">'+e.name+'</div>';d.onclick=()=>show(e);d._e=e;bindImgTip(d,e);tl.appendChild(d);});
 drawMini();updWin();
}
function show(e){pc.textContent=CAT[e.cat][0];pt.textContent=e.name;pd.textContent=e.date;pp.textContent=e.desc;panel.style.display='block';}
function showPeriod(p){pc.textContent='Période historique';pt.textContent=p.name;pd.textContent=fmt(p.start)+' → '+fmt(p.end);pp.textContent=p.info?.desc||'';panel.style.display='block';zoomToPeriod(p);}
function miniPos(bp){return pos(bp)/zoom;}
function drawMini(){mini.querySelectorAll('.m,.e').forEach(n=>n.remove());const W=mini.clientWidth;periodInfo.filter(p=>p.level===1).forEach(p=>{const n=p.name,a=p.startBp,b=p.endBp,c=p.color;const d=document.createElement('div');d.className='m';const f=v=>miniPos(v)/TOTAL*W;d.style.left=f(a)+'px';d.style.width=Math.max(2,f(b)-f(a))+'px';d.style.background=c;mini.appendChild(d);});eventsData.forEach(e=>{const d=document.createElement('div');d.className='e';d.style.left=(miniPos(e.bp)/TOTAL*mini.clientWidth)+'px';mini.appendChild(d);});}
function updWin(){const W=mini.clientWidth,tot=tl.scrollWidth||1;win.style.left=(view.scrollLeft/tot*W)+'px';win.style.width=(view.clientWidth/tot*W)+'px';}
view.addEventListener('scroll',updWin);
let miniDrag=null,suppressMiniClick=false;
win.addEventListener('pointerdown',ev=>{if(ev.button!==undefined&&ev.button!==0)return;ev.preventDefault();const wr=win.getBoundingClientRect();miniDrag={id:ev.pointerId,offset:ev.clientX-wr.left,startX:ev.clientX,moved:false};win.classList.add('dragging');win.setPointerCapture(ev.pointerId);});
win.addEventListener('pointermove',ev=>{if(!miniDrag||ev.pointerId!==miniDrag.id)return;ev.preventDefault();if(Math.abs(ev.clientX-miniDrag.startX)>1)miniDrag.moved=true;const mr=mini.getBoundingClientRect(),wr=win.getBoundingClientRect();const span=Math.max(0,mr.width-wr.width),maxScroll=Math.max(0,tl.scrollWidth-view.clientWidth);const left=Math.max(0,Math.min(span,ev.clientX-mr.left-miniDrag.offset));view.scrollLeft=span?left/span*maxScroll:0;});
function endMiniDrag(ev){if(!miniDrag||ev.pointerId!==miniDrag.id)return;suppressMiniClick=miniDrag.moved;miniDrag=null;win.classList.remove('dragging');}
win.addEventListener('pointerup',endMiniDrag);win.addEventListener('pointercancel',endMiniDrag);win.addEventListener('lostpointercapture',()=>{miniDrag=null;win.classList.remove('dragging');});
mini.addEventListener('click',ev=>{if(suppressMiniClick){suppressMiniClick=false;ev.preventDefault();return;}const r=mini.getBoundingClientRect();const bp=bpAt((ev.clientX-r.left)/r.width*tl.scrollWidth);view.scrollLeft=pos(bp)-view.clientWidth/2;});
function setZoom(z,cx){const rel=(view.scrollLeft+(cx??view.clientWidth/2))/zoom;zoom=Math.min(linearScale?2000:6,Math.max(0.3,z));render();view.scrollLeft=rel*zoom-(cx??view.clientWidth/2);}
let zoomReturn=null,zoomAnim=0;const out=document.getElementById('out');
function smoothZoom(targetZoom,targetBp,after){cancelAnimationFrame(zoomAnim);const from=zoom,to=Math.max(0.3,targetZoom),anchor=view.clientWidth/2,anchorBp=bpAt(view.scrollLeft+anchor),started=performance.now(),duration=360;function frame(now){const t=Math.min(1,(now-started)/duration),eased=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;zoom=from+(to-from)*eased;render();view.scrollLeft=pos(anchorBp)-anchor;if(t<1)zoomAnim=requestAnimationFrame(frame);else{view.scrollTo({left:pos(targetBp)-view.clientWidth/2,behavior:'smooth'});after?.();}}zoomAnim=requestAnimationFrame(frame);}
function zoomToPeriod(p){if(!zoomReturn){zoomReturn={zoom,bp:bpAt(view.scrollLeft+view.clientWidth/2),linearScale};out.style.display='inline-block';}if(linearScale&&!focusOverride){focusOverride=true;render();}const width=Math.max(1,pos(p.end)-pos(p.start));const target=zoom*view.clientWidth/(width*.8);smoothZoom(target,(p.start+p.end)/2,()=>{const left=pos(p.start),right=pos(p.end),span=right-left;if(span>0)view.scrollTo({left:(left+right)/2-view.clientWidth/2,behavior:'smooth'});});}
function zoomOut(){if(!zoomReturn)return;const old=zoomReturn;zoomReturn=null;out.style.display='none';smoothZoom(old.zoom,old.bp,()=>{focusOverride=false;linearScale=old.linearScale;document.getElementById('linearScale').checked=linearScale;render();view.scrollTo({left:pos(old.bp)-view.clientWidth/2,behavior:'smooth'});});}
out.addEventListener('click',zoomOut);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&zoomReturn)zoomOut();});
document.getElementById('linearScale').addEventListener('change',e=>{const center=bpAt(view.scrollLeft+view.clientWidth/2);linearScale=e.target.checked;zoom=Math.min(zoom,linearScale?2000:6);render();view.scrollLeft=pos(center)-view.clientWidth/2;});
zi.onclick=()=>setZoom(zoom*1.4);zo.onclick=()=>setZoom(zoom/1.4);
view.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15),e.clientX);}else{e.preventDefault();view.scrollLeft+=e.deltaY+e.deltaX;}},{passive:false});
let dr=false,sx=0,sl=0,draggedView=false,dragMoved=false;view.addEventListener('mousedown',e=>{if(e.button!==0)return;dr=true;dragMoved=false;draggedView=false;sx=e.clientX;sl=view.scrollLeft;view.classList.add('drag');});window.addEventListener('mouseup',()=>{if(dr)draggedView=dragMoved;dr=false;view.classList.remove('drag');});window.addEventListener('mousemove',e=>{if(dr){if(Math.abs(e.clientX-sx)>4)dragMoved=true;view.scrollLeft=sl-(e.clientX-sx);}});
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')view.scrollLeft+=200;if(e.key==='ArrowLeft')view.scrollLeft-=200;if(e.key==='+')setZoom(zoom*1.4);if(e.key==='-')setZoom(zoom/1.4);});
[["Big Bang",Ga(13.8)],["Terre",Ga(4.5)],["Vie",Ga(3.8)],["Dinosaures",Ma(230)],["Humanité",Ma(3)],["Antiquité",Y(-3300)],["Moyen Âge",Y(476)],["Moderne",Y(1492)],["Aujourd'hui",0]].forEach(([n,bp])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{view.scrollTo({left:pos(bp)-80,behavior:'smooth'});};jump.appendChild(b);});
Object.entries(CAT).forEach(([k,[n,c]])=>{const b=document.createElement('button');b.textContent=n;b.style.borderColor=c;b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.classList.toggle('off');render();};filters.appendChild(b);});
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();let first=null;tl.querySelectorAll('.ev').forEach(d=>{const hit=s&&(d._e.name.toLowerCase().includes(s)||d._e.desc.toLowerCase().includes(s));d.classList.toggle('hl',!!hit);if(hit&&!first)first=d;});if(first)view.scrollTo({left:parseFloat(first.style.left)-200,behavior:'smooth'});});
window.addEventListener('resize',render);
async function init(){try{const [eventsResponse,periodsResponse]=await Promise.all([fetch('events.json'),fetch('periods.json')]);if(!eventsResponse.ok)throw new Error('HTTP '+eventsResponse.status+' (events.json)');if(!periodsResponse.ok)throw new Error('HTTP '+periodsResponse.status+' (periods.json)');const [data,periods]=await Promise.all([eventsResponse.json(),periodsResponse.json()]);if(!Array.isArray(data)||data.some(e=>!e||typeof e.name!=='string'||typeof e.desc!=='string'||(e.type==='period'?typeof e.startBp!=='number'||typeof e.endBp!=='number':typeof e.bp!=='number'||typeof e.cat!=='string'||typeof e.date!=='string')))throw new Error('Format JSON inattendu dans events.json');if(!Array.isArray(periods)||periods.some(p=>!p||typeof p.name!=='string'||typeof p.startBp!=='number'||!Number.isFinite(p.startBp)||typeof p.endBp!=='number'||!Number.isFinite(p.endBp)||typeof p.color!=='string'||typeof p.level!=='number'||!Number.isInteger(p.level)||p.level<1||p.level>4||typeof p.desc!=='string'||(p.img!==undefined&&typeof p.img!=='string')))throw new Error('Format JSON inattendu dans periods.json');eventsData=data.filter(e=>e.type!=='period');periodInfo=periods;render();view.scrollLeft=0;}catch(error){const box=document.getElementById('loadError');box.textContent='Impossible de charger les événements. Ouvrez cette page depuis un serveur web local ou en ligne (pas en file://), puis réessayez. '+error.message;box.style.display='block';console.error('Chargement des événements impossible:',error);}}
init();
</script>
<span id="ver" style="position:fixed;right:8px;bottom:6px;font-size:10px;color:#888;opacity:.65;pointer-events:none;">v …</span>
<script>
/* Version affichée : SHA court du dernier commit de la branche Elec touchant FriseDuTemps, lu via l'API GitHub (un fichier ne peut pas contenir le hash de son propre commit). */
fetch('https://api.github.com/repos/NotoriousBig62/Misc/commits?sha=Elec&path=FriseDuTemps&per_page=1')
 .then(r=>r.ok?r.json():Promise.reject(r.status))
 .then(c=>{document.getElementById('ver').textContent='v '+c[0].sha.slice(0,7)})
 .catch(()=>{document.getElementById('ver').textContent='v ?'});
</script>
</body>
</html>
