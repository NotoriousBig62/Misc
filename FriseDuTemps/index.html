<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frise du temps</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
h1{font-size:18px;margin:0;font-weight:650}.sub{color:var(--muted);font-size:12px}
#ver{margin-left:auto;color:var(--muted);font-size:11px}
main{padding:16px;max-width:1600px;margin:auto}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}input[type=range]{width:140px;accent-color:var(--accent)}
#timeline{overflow:auto;border:1px solid var(--border);border-radius:8px;background:#0a0e13;position:relative}
#stage{position:relative;min-height:230px;padding:42px 0 18px}
#axis{position:absolute;top:40px;left:0;right:0;height:26px}
.tick{position:absolute;top:0;font-size:10px;color:var(--mut);border-left:1px solid var(--line);padding-left:3px;height:20px}
.seg{position:absolute;height:28px;top:70px;border-radius:3px;overflow:hidden;cursor:pointer;border:1px solid #ffffff25;min-width:2px}
.segLabel{display:block;white-space:nowrap;padding:4px 5px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;font-weight:600}
.seg:hover{filter:brightness(1.25);z-index:2}
.row2{top:106px;height:26px;line-height:26px;font-size:11px;opacity:.85}
.row3{top:134px;height:24px;line-height:24px;font-size:11px;opacity:.7}
.row4{top:160px;height:22px;line-height:22px;font-size:11px;opacity:.7}
#axis{position:absolute;top:40px;left:0;right:0;height:26px}
.tick{position:absolute;top:0;font-size:10px;color:var(--mut);border-left:1px solid var(--line);padding-left:3px;height:20px}
#panel{margin-top:14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;min-height:96px}
#panel h2{margin:0 0 5px;font-size:16px}#panel p{margin:4px 0;color:var(--muted)}
#events{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.event{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff0c;cursor:pointer}
.event:hover{color:#fff}.date{min-width:90px;color:var(--accent);font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:20;display:none;pointer-events:none;background:#202938;border:1px solid #40516a;border-radius:8px;padding:6px;box-shadow:0 6px 22px #0009}
.tip img{display:block;max-width:220px;max-height:150px;border-radius:4px}.tip small{display:block;color:var(--muted);max-width:220px;margin-top:4px}
#status{font-size:11px;color:var(--muted);margin-left:8px}
</style>
</head>
<body>
<header><h1>Frise du temps</h1><span class="sub">De la formation de la Terre à aujourd'hui</span><span id="ver"></span></header>
<main>
<div class="controls">
<button id="zoomOut">−</button><input id="zoom" type="range" min="0.4" max="4" step="0.05" value="1"><button id="zoomIn">+</button>
<button id="reset">Réinitialiser</button><label><input id="linear" type="checkbox"> Échelle linéaire</label><span id="status"></span>
</div>
<div id="timeline"><div id="stage"><div id="axis"></div></div></div>
<section id="panel"><h2>Cliquez sur une période</h2><p>Survolez une période pour voir une image associée.</p><div id="events"></div></section>
<div id="tip" class="tip"><img><small></small></div>
<script>
'use strict';
const START=4600,TOTAL=1200;
const SCALE=[[4600,541,220],[541,252,180],[252,66,180],[66,2.58,180],[2.58,0,260]];
const Ma=x=>x;
const Y=x=>2026-x;
const P=[
 ["Hadéen",Ma(4600),Ma(4000),"#7d4e57",1],["Archéen",Ma(4000),Ma(2500),"#a66d45",1],["Protérozoïque",Ma(2500),Ma(541),"#4e7890",1],
 ["Paléozoïque",Ma(541),Ma(252),"#5a9a65",2],["Mésozoïque",Ma(252),Ma(66),"#7a9a45",2],["Cénozoïque",Ma(66),0,"#d0a040",2],
 ["Cambrien",Ma(541),Ma(485),"#5a8a4a",3],["Ordovicien",Ma(485),Ma(444),"#6a9a5a",3],["Silurien",Ma(444),Ma(419),"#8aaa5a",3],["Dévonien",Ma(419),Ma(359),"#a0aa55",3],["Carbonifère",Ma(359),Ma(299),"#6a8a3a",3],["Permien",Ma(299),Ma(252),"#8aaa4a",3],
 ["Trias",Ma(252),Ma(201),"#9a8a3a",3],["Jurassique",Ma(201),Ma(145),"#7a9a3a",3],["Crétacé",Ma(145),Ma(66),"#6a9a3a",3],
 ["Paléogène",Ma(66),Ma(23),"#c0803a",3],["Néogène",Ma(23),Ma(2.58),"#d0a040",3]
];
/* Segments supplémentaires pour la partie récente (niveaux 2, 3 & 4) */
const P2=[
 ["Pléistocène",Ma(2.58),Ma(0.0117),"#e0b050",3],["Holocène",Ma(0.0117),0,"#f0c060",3],
 ["Préhistoire",Y(-300000),Y(-3500),"#7a9a60",4],["Antiquité",Y(-3500),Y(476),"#ba8a45",4],
 ["Moyen Âge",Y(476),Y(1492),"#6a6aaa",4],["Temps modernes",Y(1492),Y(1789),"#9a6aaa",4],
 ["Révolutions industrielles",Y(1760),Y(1914),"#5a7a9a",3],["XXe siècle",Y(1900),Y(2000),"#aa4a6a",4],["XXIe siècle",Y(2000),0,"#4aaa9a",4]
];
/* ===== Rendu ===== */
const tl=document.getElementById('stage'),axis=document.getElementById('axis'),zoomEl=document.getElementById('zoom'),panel=document.getElementById('panel'),tip=document.getElementById('tip');
let zoom=1,linearScale=false,focusOverride=null,draggedView=false;
const periodInfo=[];
function pos(bp){let x=0;for(const [a,b,w] of SCALE){if(bp<=a&&bp>=b){const f=(a-b)?(a-bp)/(a-b):0;return (x+w*f)*zoom;}x+=w;}return x*zoom;}
function fmt(x){return x>=1?`${Math.round(x)} Ma`:x>0?`${x} Ma`:'aujourd’hui';}
function hideImgTip(){tip.style.display='none';}
function bindImgTip(el,info){el.addEventListener('mouseenter',e=>{if(!info||!info.image)return;tip.querySelector('img').src=info.image;tip.querySelector('small').textContent=info.name;tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';});el.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}});el.addEventListener('mouseleave',hideImgTip);}
function render(){
 hideImgTip();tl.style.width=TOTAL*zoom+'px';tl.querySelectorAll('.seg,.ev,.tick').forEach(n=>n.remove());
 const all=P.concat(P2);all.forEach(([n,a,b,c,l])=>{const d=document.createElement('div');d.className='seg'+(l==2?' row2':l==3?' row3':l==4?' row4':'');if(l==1)d.style.top='70px';const x1=pos(a),x2=pos(b);d.style.left=x1+'px';d.style.width=Math.max(2,x2-x1)+'px';d.style.background=c;const label=document.createElement('span');label.className='segLabel';label.textContent=n;d.appendChild(label);d.title=n+' ('+fmt(a)+' → '+fmt(b)+')';const info=periodInfo.find(e=>e.name===n);bindImgTip(d,info);d._period={name:n,start:a,end:b,color:c,info};d.addEventListener('click',()=>{if(draggedView){draggedView=false;return;}showPeriod(d._period);});tl.appendChild(d);});
 const ticks=[];if(linearScale&&!focusOverride){const raw=START/Math.max(4,Math.min(1000,Math.round(TOTAL*zoom/160)));const pow=10**Math.floor(Math.log10(raw)),ratio=raw/pow;const step=(ratio<=1?1:ratio<=2?2:ratio<=5?5:10)*pow;for(let bp=START;bp>0;bp-=step)ticks.push(bp);ticks.push(0);}else{SCALE.forEach(([a,b,w])=>{const n=Math.max(4,Math.round(w*zoom/160));for(let i=0;i<n;i++)ticks.push(a-(a-b)*i/n);});ticks.push(0);}
 ticks.forEach(bp=>{const t=document.createElement('div');t.className='tick';t.style.left=pos(bp)+'px';t.textContent=fmt(bp);axis.appendChild(t);});
}
function showPeriod(p){panel.querySelector('h2').textContent=p.name;panel.querySelector('p').textContent=`${fmt(p.start)} → ${fmt(p.end)}`;}
zoomEl.addEventListener('input',()=>{zoom=+zoomEl.value;render();});document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(4,zoom+.2);zoomEl.value=zoom;render();};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.4,zoom-.2);zoomEl.value=zoom;render();};document.getElementById('reset').onclick=()=>{zoom=1;zoomEl.value=1;linearScale=false;document.getElementById('linear').checked=false;render();};document.getElementById('linear').onchange=e=>{linearScale=e.target.checked;render();};
render();
fetch('events.json').then(r=>r.json()).then(data=>{periodInfo.push(...data);document.getElementById('status').textContent=`${data.length} événements chargés`;}).catch(()=>{document.getElementById('status').textContent='Événements indisponibles';});
fetch('https://api.github.com/repos/NotoriousBig62/Misc/commits?path=FriseDuTemps/index.html&per_page=1').then(r=>r.json()).then(c=>{document.getElementById('ver').textContent='v '+c[0].sha.slice(0,7)}).catch(()=>{document.getElementById('ver').textContent='v ?'});
</script>
</body>
</html>
