<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frise du temps – du Big Bang à nos jours</title>
<style>
:root{--bg:#0f1220;--panel:#181c30;--txt:#e8eaf3;--mut:#8b91ad;--line:#3a4066}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 12px;background:var(--panel);display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 10px 0 0}
button,input{background:#252a47;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer}
button:hover{background:#343b66}
button.off{opacity:.35}
input{cursor:text;width:170px}
#jump,#filters{display:flex;flex-wrap:wrap;gap:5px}
#view{flex:1;position:relative;overflow-x:scroll;overflow-y:hidden;cursor:grab}
#view.drag{cursor:grabbing}
#tl{position:relative;height:100%}
.seg{position:absolute;top:70px;height:34px;line-height:34px;font-size:12px;padding:0 6px;white-space:nowrap;overflow:hidden;border-right:1px solid #0008;color:#fff;font-weight:600}
.row2{top:106px;height:26px;line-height:26px;font-size:11px;opacity:.85}
.row3{top:134px;height:24px;line-height:24px;font-size:11px;opacity:.7}
#axis{position:absolute;top:40px;left:0;right:0;height:26px}
.tick{position:absolute;top:0;font-size:10px;color:var(--mut);border-left:1px solid var(--line);padding-left:3px;height:20px}
.ev{position:absolute;width:0}
.ev .dot{position:absolute;left:-5px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;cursor:pointer;background:var(--c)}
.ev .stem{position:absolute;left:0;width:1px;background:var(--c);opacity:.6}
.ev .lbl{position:absolute;left:4px;font-size:11px;white-space:nowrap;cursor:pointer;background:#0009;padding:1px 4px;border-radius:3px;border-left:2px solid var(--c)}
.ev.hl .dot{box-shadow:0 0 0 4px #ffd54a}
.ev:hover{z-index:5}
#mini{height:46px;background:var(--panel);border-top:1px solid var(--line);position:relative;cursor:pointer}
#mini .m{position:absolute;top:4px;height:8px}
#mini .e{position:absolute;top:18px;width:2px;height:10px;background:#fff8}
#win{position:absolute;top:0;bottom:0;border:2px solid #ffd54a;background:#ffd54a22;pointer-events:none}
#panel{position:fixed;right:12px;bottom:60px;width:340px;max-width:90vw;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:none;box-shadow:0 8px 30px #0009;z-index:20}
#panel h2{margin:0 0 4px;font-size:17px}
#panel .d{color:#ffd54a;font-size:13px;margin-bottom:8px}
#panel .c{font-size:11px;color:var(--mut);margin-bottom:6px}
#panel p{margin:0;font-size:13px;line-height:1.45}
#panel .x{position:absolute;top:6px;right:8px}
#imgTip{position:fixed;display:none;width:max-content;max-width:min(260px,calc(100vw - 24px));padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px #000a;z-index:40;pointer-events:none}
#imgTip img{display:block;max-width:100%;max-height:190px;object-fit:contain;border-radius:4px}
#imgTip .caption{margin-top:5px;font-size:11px;line-height:1.3;color:var(--txt);white-space:normal}
</style>
</head>
<body>
<header>
<h1>⏳ Frise du temps</h1>
<button id="zo">−</button><button id="zi">+</button>
<label><input id="linearScale" type="checkbox" style="width:auto;cursor:pointer"> Échelle linéaire</label>
<input id="q" placeholder="Rechercher…">
<div id="jump"></div>
<div id="filters"></div>
</header>
<div id="view"><div id="tl"><div id="axis"></div></div></div>
<div id="mini"><div id="win"></div></div>
<div id="panel"><button class="x" onclick="panel.style.display='none'">✕</button><div class="c" id="pc"></div><h2 id="pt"></h2><div class="d" id="pd"></div><p id="pp"></p></div>
<div id="loadError" role="alert" style="display:none;position:fixed;inset:12px 12px auto;background:#7b2525;color:#fff;padding:12px;border-radius:8px;z-index:30"></div>
<div id="imgTip" aria-hidden="true"><img alt=""><div class="caption"></div></div>

<script>
/* Dates en "années avant aujourd'hui (BP)" ; l'an 2026 = 0.
   Pour une année calendaire Y : bp = 2026 - Y */
const NOW=2026;
const Y=y=>NOW-y;
const Ma=x=>x*1e6, Ga=x=>x*1e9, ka=x=>x*1e3;

/* Échelle non linéaire par segments : [bp_debut(ancien), bp_fin(récent), largeur_px] */
const SCALE=[
 [Ga(13.8),Ga(4.6),1100],
 [Ga(4.6),Ga(0.541),1500],
 [Ma(541),Ma(66),1500],
 [Ma(66),Ma(2.58),1300],
 [Ma(2.58),ka(12),1300],
 [ka(12),Y(-3000),1300],
 [Y(-3000),Y(500),1400],
 [Y(500),Y(1500),1300],
 [Y(1500),Y(1800),1300],
 [Y(1800),0,2600]
];
const TOTAL=SCALE.reduce((a,s)=>a+s[2],0);
const START=SCALE[0][0];
let zoom=1,linearScale=false;
function pos(bp){
 if(linearScale){
  if(bp>START)return 0;
  if(bp<0)return TOTAL*zoom;
  return (START-bp)/START*TOTAL*zoom;
 }
 let x=0;
 for(const [a,b,w] of SCALE){
  if(bp<=a && bp>=b){return (x+(a-bp)/(a-b)*w)*zoom}
  x+=w;
 }
 return bp>SCALE[0][0]?0:TOTAL*zoom;
}
function bpAt(px){
 const x=px/zoom;
 if(linearScale)return START*(1-Math.max(0,Math.min(TOTAL,x))/TOTAL);
 if(x<=0)return START;
 let offset=0;
 for(const [a,b,w] of SCALE){
  if(x<=offset+w)return a-(x-offset)/w*(a-b);
  offset+=w;
 }
 return 0;
}

/* Périodes : [nom, début bp, fin bp, couleur, niveau(1,2,3)] */
const P=[
 // Niveau 1 : éons
 ["Hadéen",Ga(4.6),Ga(4.0),"#8d3b2f",1],["Archéen",Ga(4.0),Ga(2.5),"#9c5a2a",1],["Protérozoïque",Ga(2.5),Ma(541),"#7a6a2a",1],["Phanérozoïque",Ma(541),0,"#2a7a4a",1],
 // Niveau 2 : ères / grandes périodes historiques
 ["Paléozoïque",Ma(541),Ma(252),"#3a7ab0",2],["Mésozoïque",Ma(252),Ma(66),"#3aa07a",2],["Cénozoïque",Ma(66),0,"#c0903a",2],
 // Niveau 3 : périodes
 ["Cambrien",Ma(541),Ma(485),"#4a8a6a",3],["Ordovicien",Ma(485),Ma(444),"#4a7a8a",3],["Silurien",Ma(444),Ma(419),"#5a8a9a",3],["Dévonien",Ma(419),Ma(359),"#9a7a4a",3],["Carbonifère",Ma(359),Ma(299),"#5a6a5a",3],["Permien",Ma(299),Ma(252),"#a05a4a",3],
 ["Trias",Ma(252),Ma(201),"#7a4a8a",3],["Jurassique",Ma(201),Ma(145),"#3a8a9a",3],["Crétacé",Ma(145),Ma(66),"#6a9a3a",3],
 ["Paléogène",Ma(66),Ma(23),"#c0803a",3],["Néogène",Ma(23),Ma(2.58),"#d0a040",3],["Quaternaire",Ma(2.58),0,"#e0b050",3]
];
/* Segments supplémentaires pour la partie récente (niveaux 2 & 3) */
const P2=[
 ["Pléistocène",Ma(2.58),ka(11.7),"#4a7ab0",2],["Holocène",ka(11.7),0,"#4aa07a",2],
 ["Paléolithique",Ma(3.3),ka(12),"#9a5a3a",3],["Mésolithique",ka(12),ka(9),"#8a6a4a",3],["Néolithique",ka(9),Y(-3300),"#7a8a3a",3],
 ["Âge du bronze",Y(-3300),Y(-1200),"#b0703a",3],["Âge du fer",Y(-1200),Y(-800),"#707a8a",3],
 ["Antiquité",Y(-3300),Y(476),"#a0703a",2],["Moyen Âge",Y(476),Y(1492),"#6a5a9a",2],["Renaissance",Y(1492),Y(1620),"#c05a7a",3],
 ["Temps modernes",Y(1492),Y(1789),"#3a8a9a",2],["Époque contemporaine",Y(1789),0,"#c04a4a",2],
 ["Haut Moyen Âge",Y(476),Y(1000),"#7a6aaa",3],["Bas Moyen Âge",Y(1000),Y(1492),"#8a7aba",3],
 ["Révolutions industrielles",Y(1760),Y(1914),"#5a7a9a",3],["XXe siècle",Y(1900),Y(2000),"#aa4a6a",3],["XXIe siècle",Y(2000),0,"#4aaa9a",3]
];

/* Catégories */
const CAT={cosmos:["Cosmos","#b388ff"],terre:["Terre","#ff8a65"],vie:["Vie","#66bb6a"],humain:["Humanité","#ffca28"],civ:["Civilisations","#42a5f5"],pol:["Politique/Guerre","#ef5350"],sci:["Sciences/Tech","#26c6da"],art:["Arts/Religion","#ec407a"]};

/* Événements chargés depuis events.json au démarrage. */
let eventsData=[];

/* ===== Rendu ===== */
const view=document.getElementById('view'),tl=document.getElementById('tl'),mini=document.getElementById('mini'),win=document.getElementById('win'),axis=document.getElementById('axis');
const panel=document.getElementById('panel');
const imgTip=document.getElementById('imgTip'),imgTipImg=imgTip.querySelector('img'),imgTipCaption=imgTip.querySelector('.caption');
let tipTarget=null,tipReady=false,tipRequest=0,tipX=0,tipY=0;
function hideImgTip(){tipRequest++;tipTarget=null;tipReady=false;imgTip.style.display='none';}
function positionImgTip(){
 if(!tipReady)return;
 const margin=12,offset=14,r=imgTip.getBoundingClientRect();
 const left=Math.max(margin,Math.min(tipX+offset,window.innerWidth-r.width-margin));
 const top=Math.max(margin,Math.min(tipY+offset,window.innerHeight-r.height-margin));
 imgTip.style.left=left+'px';imgTip.style.top=top+'px';
}
function bindImgTip(node,entry){
 if(!entry||!entry.img)return;
 node.addEventListener('mouseenter',e=>{
  hideImgTip();tipTarget=node;const request=tipRequest;tipX=e.clientX;tipY=e.clientY;
  imgTipCaption.textContent=entry.name;imgTipImg.alt=entry.name;
  imgTipImg.onload=()=>{if(tipTarget!==node||tipRequest!==request)return;tipReady=true;imgTip.style.display='block';positionImgTip();};
  imgTipImg.onerror=()=>{if(tipTarget===node&&tipRequest===request)hideImgTip();};
  imgTipImg.src=entry.img;
 });
 node.addEventListener('mousemove',e=>{if(tipTarget!==node)return;tipX=e.clientX;tipY=e.clientY;positionImgTip();});
 node.addEventListener('mouseleave',()=>{if(tipTarget===node)hideImgTip();});
}
const active=new Set(Object.keys(CAT));

function fmt(bp){
 if(bp>=1e9)return (bp/1e9).toFixed(1).replace('.',',')+' Ga';
 if(bp>=1e6)return Math.round(bp/1e6)+' Ma';
 if(bp>=1e4)return Math.round(bp/1e3)+' ka';
 const y=NOW-bp; return y<=0?(-y+' av. J.-C.'):String(Math.round(y));
}
function render(){
 hideImgTip();
 tl.style.width=TOTAL*zoom+'px';
 tl.querySelectorAll('.seg,.ev,.tick').forEach(n=>n.remove());
 // Segments
 const all=P.concat(P2);
 all.forEach(([n,a,b,c,l])=>{
  const d=document.createElement('div');
  d.className='seg'+(l==2?' row2':l==3?' row3':'');
  if(l==1)d.style.top='70px';
  const x1=pos(a),x2=pos(b);
  d.style.left=x1+'px';d.style.width=Math.max(2,x2-x1)+'px';d.style.background=c;d.textContent=n;d.title=n+' ('+fmt(a)+' → '+fmt(b)+')';
  bindImgTip(d,eventsData.find(e=>e.name===n&&e.img));
  tl.appendChild(d);
 });
 // Graduations
 const ticks=[];
 if(linearScale){
  const raw=START/Math.max(4,Math.min(1000,Math.round(TOTAL*zoom/160)));
  const pow=10**Math.floor(Math.log10(raw)),ratio=raw/pow;
  const step=(ratio<=1?1:ratio<=2?2:ratio<=5?5:10)*pow;
  for(let bp=START;bp>0;bp-=step)ticks.push(bp);
  ticks.push(0);
 }else{
  SCALE.forEach(([a,b,w])=>{
   const n=Math.max(4,Math.round(w*zoom/160));
   for(let i=0;i<n;i++){ticks.push(a-(a-b)*i/n)}
  });
  ticks.push(0);
 }
 ticks.forEach(bp=>{
  const t=document.createElement('div');t.className='tick';t.style.left=pos(bp)+'px';t.textContent=fmt(bp);axis.appendChild(t);
 });
 // Événements
 const evs=eventsData.filter(e=>active.has(e.cat)).sort((a,b)=>b.bp-a.bp);
 const lastEnd=[];const base=190,H=view.clientHeight||500;
 const lanes=Math.max(4,Math.floor((H-base-20)/22));
 evs.forEach(e=>{
  const x=pos(e.bp);
  const w=e.name.length*6.5+14;
  let lane=0;
  while(lane<lanes && lastEnd[lane]>x-2)lane++;
  if(lane>=lanes)lane=lanes-1;
  lastEnd[lane]=x+w;
  const d=document.createElement('div');d.className='ev';d.style.left=x+'px';d.style.setProperty('--c',CAT[e.cat][1]);
  const top=base+lane*22;
  d.innerHTML='<div class="stem" style="top:'+(base-8)+'px;height:'+(lane*22+8)+'px"></div><div class="dot" style="top:'+(base-14)+'px"></div><div class="lbl" style="top:'+top+'px">'+e.name+'</div>';
  d.onclick=()=>show(e);d._e=e;
  bindImgTip(d,e);
  tl.appendChild(d);
 });
 drawMini();updWin();
}
function show(e){
 pc.textContent=CAT[e.cat][0];pt.textContent=e.name;pd.textContent=e.date;pp.textContent=e.desc;panel.style.display='block';
}
function drawMini(){
 mini.querySelectorAll('.m,.e').forEach(n=>n.remove());
 const W=mini.clientWidth;
 P.filter(p=>p[4]==1).forEach(([n,a,b,c])=>{
  const d=document.createElement('div');d.className='m';
  const f=v=>pos(v)/zoom/TOTAL*W;
  d.style.left=f(a)+'px';d.style.width=Math.max(2,f(b)-f(a))+'px';d.style.background=c;mini.appendChild(d);
 });
 eventsData.forEach(e=>{const d=document.createElement('div');d.className='e';d.style.left=(pos(e.bp)/zoom/TOTAL*mini.clientWidth)+'px';mini.appendChild(d)});
}
function updWin(){
 const W=mini.clientWidth,tot=tl.scrollWidth||1;
 win.style.left=(view.scrollLeft/tot*W)+'px';
 win.style.width=(view.clientWidth/tot*W)+'px';
}
view.addEventListener('scroll',updWin);
mini.addEventListener('click',ev=>{
 const r=mini.getBoundingClientRect();
 const bp=bpAt((ev.clientX-r.left)/r.width*tl.scrollWidth);
 view.scrollLeft=pos(bp)-view.clientWidth/2;
});
function setZoom(z,cx){
 const rel=(view.scrollLeft+(cx??view.clientWidth/2))/zoom;
 zoom=Math.min(linearScale?2000:6,Math.max(0.3,z));render();
 view.scrollLeft=rel*zoom-(cx??view.clientWidth/2);
}
document.getElementById('linearScale').addEventListener('change',e=>{
 const center=bpAt(view.scrollLeft+view.clientWidth/2);
 linearScale=e.target.checked;zoom=Math.min(zoom,linearScale?2000:6);render();
 view.scrollLeft=pos(center)-view.clientWidth/2;
});
zi.onclick=()=>setZoom(zoom*1.4);zo.onclick=()=>setZoom(zoom/1.4);
view.addEventListener('wheel',e=>{
 if(e.ctrlKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15),e.clientX)}
 else{e.preventDefault();view.scrollLeft+=e.deltaY+e.deltaX}
},{passive:false});
let dr=false,sx=0,sl=0;
view.addEventListener('mousedown',e=>{dr=true;sx=e.clientX;sl=view.scrollLeft;view.classList.add('drag')});
window.addEventListener('mouseup',()=>{dr=false;view.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(dr)view.scrollLeft=sl-(e.clientX-sx)});
window.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight')view.scrollLeft+=200;
 if(e.key==='ArrowLeft')view.scrollLeft-=200;
 if(e.key==='+')setZoom(zoom*1.4);
 if(e.key==='-')setZoom(zoom/1.4);
});
// Sauts
[["Big Bang",Ga(13.8)],["Terre",Ga(4.5)],["Vie",Ga(3.8)],["Dinosaures",Ma(230)],["Humanité",Ma(3)],["Antiquité",Y(-3300)],["Moyen Âge",Y(476)],["Moderne",Y(1492)],["Aujourd'hui",0]].forEach(([n,bp])=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{view.scrollTo({left:pos(bp)-80,behavior:'smooth'})};jump.appendChild(b);
});
// Filtres
Object.entries(CAT).forEach(([k,[n,c]])=>{
 const b=document.createElement('button');b.textContent=n;b.style.borderColor=c;
 b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.classList.toggle('off');render()};filters.appendChild(b);
});
// Recherche
q.addEventListener('input',()=>{
 const s=q.value.trim().toLowerCase();let first=null;
 tl.querySelectorAll('.ev').forEach(d=>{
  const hit=s&&(d._e.name.toLowerCase().includes(s)||d._e.desc.toLowerCase().includes(s));
  d.classList.toggle('hl',!!hit);if(hit&&!first)first=d;
 });
 if(first)view.scrollTo({left:parseFloat(first.style.left)-200,behavior:'smooth'});
});
window.addEventListener('resize',render);
async function init(){
 try{
  const response=await fetch('events.json');
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data) || data.some(e=>!e || typeof e.name!=='string' || typeof e.bp!=='number' || typeof e.cat!=='string' || typeof e.date!=='string' || typeof e.desc!=='string'))throw new Error('Format JSON inattendu');
  eventsData=data;
  render();
  view.scrollLeft=0;
 }catch(error){
  const box=document.getElementById('loadError');
  box.textContent='Impossible de charger les événements. Ouvrez cette page depuis un serveur web local ou en ligne (pas en file://), puis réessayez. '+error.message;
  box.style.display='block';
  console.error('Chargement des événements impossible:',error);
 }
}
init();
</script>
<span id="ver" style="position:fixed;right:8px;bottom:6px;font-size:10px;color:#888;opacity:.65;pointer-events:none;">v …</span>
<script>
/* Version affichée : SHA court du dernier commit de la branche Elec touchant FriseDuTemps, lu via l'API GitHub (un fichier ne peut pas contenir le hash de son propre commit). */
fetch('https://api.github.com/repos/NotoriousBig62/Misc/commits?sha=Elec&path=FriseDuTemps&per_page=1')
 .then(r=>r.ok?r.json():Promise.reject(r.status))
 .then(c=>{document.getElementById('ver').textContent='v '+c[0].sha.slice(0,7)})
 .catch(()=>{document.getElementById('ver').textContent='v ?'});
</script>
</body>
</html>
